stages:
  - build
  - test

# 1. 构建阶段
build:
  stage: build
  script:
    - echo "Building the project..."
    - mvn clean install
    # - # 在这里添加构建项目的命令，比如 npm install 或者 mvn clean install

# 2. 测试阶段
