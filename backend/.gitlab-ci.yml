# GitLab CI/CD configuration for nzq-blog-backend
# This file defines the pipeline for building, testing, and deploying the Spring Boot application

stages:
  - build
  - test
  - package
  - docker-build
  - docker-push
  - deploy

variables:
  # Maven configuration
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

  # Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: "$CI_REGISTRY"  # GitLab Container Registry
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"  # Auto-set by GitLab
  DOCKER_TAG: "$CI_COMMIT_REF_SLUG"  # Branch name as tag

  # Application configuration
  CONTAINER_NAME: "nzq-blog-backend"
  APP_PORT: "8080"

# Cache Maven dependencies to speed up builds
cache:
  paths:
    - .m2/repository/
  key: "$CI_COMMIT_REF_SLUG"

# ==================== BUILD STAGE ====================
build:
  stage: build
  image: maven:3.8.8-eclipse-temurin-17
  script:
    - echo "Building Spring Boot application..."
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - target/
    expire_in: 1 week
  only:
    - main
    - dev
    - merge_requests
  tags:
    - docker

# ==================== TEST STAGE ====================
test:
  stage: test
  image: maven:3.8.8-eclipse-temurin-17
  script:
    - echo "Running tests..."
    - mvn test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week
  only:
    - main
    - dev
    - merge_requests
  tags:
    - docker

# ==================== PACKAGE STAGE ====================
package:
  stage: package
  image: maven:3.8.8-eclipse-temurin-17
  script:
    - echo "Packaging application..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  only:
    - main
    - dev
    - tags
  tags:
    - docker

# ==================== DOCKER BUILD STAGE ====================
docker-build:
  stage: docker-build
  image: docker:20.10.24
  services:
    - docker:20.10.24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
    - docker tag $DOCKER_IMAGE:$DOCKER_TAG $DOCKER_IMAGE:latest
  artifacts:
    paths:
      - Dockerfile
    expire_in: 1 week
  only:
    - main
    - dev
    - tags
  tags:
    - docker
  dependencies:
    - package

# ==================== DOCKER PUSH STAGE ====================
docker-push:
  stage: docker-push
  image: docker:20.10.24
  services:
    - docker:20.10.24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Pushing Docker image to registry..."
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
    - dev
    - tags
  tags:
    - docker
  dependencies:
    - docker-build

# ==================== DEPLOY STAGE ====================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying to server..."
    - |
      ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "
        # Pull the latest image
        docker pull $DOCKER_IMAGE:$DOCKER_TAG

        # Stop and remove existing container
        docker stop $CONTAINER_NAME || true
        docker rm $CONTAINER_NAME || true

        # Run new container
        docker run -d \
          --name $CONTAINER_NAME \
          --restart unless-stopped \
          -p $APP_PORT:8080 \
          -e SPRING_PROFILES_ACTIVE=production \
          $DOCKER_IMAGE:$DOCKER_TAG

        # Clean up old images
        docker image prune -f
      "
  only:
    - main
    - tags
  tags:
    - docker
  dependencies:
    - docker-push
  environment:
    name: production
    url: http://$DEPLOY_SERVER:$APP_PORT/api/hello

# ==================== MANUAL DEPLOY TO STAGING ====================
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying to staging server..."
    - |
      ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_SERVER "
        docker pull $DOCKER_IMAGE:$DOCKER_TAG
        docker stop $CONTAINER_NAME-staging || true
        docker rm $CONTAINER_NAME-staging || true
        docker run -d \
          --name $CONTAINER_NAME-staging \
          -p 8081:8080 \
          -e SPRING_PROFILES_ACTIVE=staging \
          $DOCKER_IMAGE:$DOCKER_TAG
      "
  when: manual
  only:
    - dev
  tags:
    - docker
  dependencies:
    - docker-push
  environment:
    name: staging
    url: http://$STAGING_SERVER:8081/api/hello